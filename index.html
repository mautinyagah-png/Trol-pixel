function TC(){return THEMES[currentTheme];}

/* ---------- AUDIO ---------- */
const Sfx=(()=>{let actx=null,muted=false;
  function ci(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}}if(actx&&actx.state==='suspended')actx.resume();return actx;}
  function blip(t,f0,f1,d,v,dl){const a=ci();if(!a||muted)return;const t0=a.currentTime+(dl||0);const o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.setValueAtTime(Math.max(20,f0),t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+d);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+0.03);}
  function noise(d,v){const a=ci();if(!a||muted)return;const len=Math.max(1,Math.floor(a.sampleRate*d));const buf=a.createBuffer(1,len,a.sampleRate);const dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource();s.buffer=buf;const g=a.createGain();g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);s.connect(g);g.connect(a.destination);s.start();}
  return{unlock(){ci();},jump(){blip('square',250,600,0.09,0.10);},dblJump(){blip('square',420,950,0.11,0.11);},death(){blip('sawtooth',340,50,0.34,0.13);noise(0.20,0.09);},
    win(){blip('triangle',523,523,0.10,0.12,0);blip('triangle',659,659,0.10,0.12,0.09);blip('triangle',784,784,0.10,0.12,0.18);blip('triangle',1047,1047,0.24,0.13,0.27);},
    click(){blip('square',880,460,0.045,0.06);},thud(){blip('triangle',130,38,0.16,0.14);noise(0.08,0.05);},whoosh(){blip('sine',700,180,0.34,0.09);},
    ui(){blip('square',720,980,0.05,0.05);},bait(){blip('sawtooth',800,60,0.42,0.15);noise(0.30,0.10);},eye(){blip('sine',180,900,0.18,0.09);},
    roll(){blip('square',140,220,0.10,0.07);},boulder(){blip('sawtooth',200,60,0.5,0.14);noise(0.3,0.08);},
    toggleMute(){muted=!muted;return muted;},isMuted(){return muted;}};
})();

/* ---------- INPUT ---------- */
const keys=Object.create(null);let jumpBuffer=0;const mouse={x:-1,y:-1};
window.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  Sfx.unlock();
  if(!keys[e.code]){
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jumpBuffer=7;
    if(e.code==='KeyM')Sfx.toggleMute();
    if(e.code==='KeyT'){currentTheme=currentTheme==='dark'?'light':'dark';Sfx.ui();}
    if(e.code==='KeyR'){if(gameState==='victory')restartRun();else if(gameState==='play')kill();}
    if(e.code==='Escape'||e.code==='KeyL'){
      if(gameState==='select'){gameState='play';Sfx.ui();}
      else if(gameState==='play'||gameState==='victory'){if(e.shiftKey)unlocked=LEVELS.length;gameState='select';Sfx.ui();}
    }
    if(gameState==='select'){
      let p=-1;
      if(e.code.startsWith('Digit')){const d=parseInt(e.code.slice(5),10);p=(d===0)?9:d-1;}
      else if(e.code.startsWith('Numpad')){const d=parseInt(e.code.slice(6),10);p=(d===0)?9:d-1;}
      if(p>=0&&p<unlocked&&p<LEVELS.length)startLevel(p);
    }
  }
  keys[e.code]=true;
},{passive:false});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
function mp(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};}
cv.addEventListener('mousemove',e=>{const p=mp(e);mouse.x=p.x;mouse.y=p.y;});
cv.addEventListener('mousedown',e=>{
  Sfx.unlock();if(gameState!=='select')return;
  const p=mp(e);
  for(let i=0;i<LEVELS.length;i++){const r=lsRect(i);if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){if(i<unlocked)startLevel(i);return;}}
});

/* ---------- UTIL ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function newGrid(cols,rows){cols=cols||32;rows=rows||18;const g=[];for(let r=0;r<rows;r++)g.push(new Array(cols).fill('.'));return g;}
function fillR(g,c0,r0,c1,r1,ch){ch=ch||'#';for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(g[r]&&c>=0&&c<g[r].length)g[r][c]=ch;}
function gridStr(g){return g.map(r=>r.join(''));}

/* ---------- TOWER HELPER ---------- */
function buildTower(R,C,config){
  config=config||{};
  const g=newGrid(C,R);
  fillR(g,0,R-2,C-1,R-1);
  const stepW=config.stepW||4;
  const stepUp=config.stepUp||2;
  const colGap=config.colGap||4;
  const plat=[];
  let cs=6,rs=R-4;
  while(rs>4&&cs+stepW<C){
    fillR(g,cs,rs,cs+stepW-1,rs);
    plat.push({c:cs,r:rs,w:stepW});
    cs+=colGap;rs-=stepUp;
  }
  const traps=[];
  if(config.spikes){
    for(let i=1;i<plat.length;i+=2){
      traps.push({type:'rolling_spike',x:plat[i].c*T,y:plat[i].r*T-16,w:16,h:16,vx:0,
        speed:2.4+Math.random()*0.4,maxSpeed:3.3,minX:plat[i].c*T-5,maxX:plat[i].c*T+plat[i].w*T+5,
        triggerRadius:200,homing:i%4===3,active:false});
    }
  }
  if(config.eyes){
    for(let i=0;i<plat.length;i+=3){
      traps.push({type:'eye_ambush',x:plat[i].c*T+20,y:plat[i].r*T-60,w:10,h:14,dir:-1,
        speed:6.5,triggerRadius:200,phase:'idle',timer:0,projActive:false,projX:0,projY:0,projVx:0});
    }
  }
  if(config.crumbles){
    for(let i=2;i<plat.length;i+=3){
      for(let c=plat[i].c;c<plat[i].c+plat[i].w;c++)g[plat[i].r][c]='.';
      traps.push({type:'crumble',x:plat[i].c*T,y:plat[i].r*T,w:plat[i].w*T,h:20});
    }
  }
  if(config.collapses){
    for(let i=3;i<plat.length;i+=4){
      traps.push({type:'collapse',x:plat[i].c*T,y:plat[i].r*T-20,w:40,h:20,
        dropX:plat[i].c*T,dropW:40,dropH:60,landY:plat[i].r*T});
    }
  }
  if(config.invisible){
    for(let i=1;i<plat.length;i+=2){
      for(let c=plat[i].c;c<plat[i].c+plat[i].w;c++)g[plat[i].r][c]='.';
      traps.push({type:'invis',x:plat[i].c*T,y:plat[i].r*T,w:plat[i].w*T,h:20});
    }
  }
  if(config.ambushes){
    for(let i=1;i<plat.length;i+=2){
      traps.push({type:'ambush',x:plat[i].c*T+plat[i].w*T/2-10,baseY:plat[i].r*T,w:20,h:30,
        triggerX:plat[i].c*T,triggered:false,timer:0,h01:0});
    }
  }
  return{g,plat,traps};
}

let levelIndex=0,deaths=0,sessionTime=0,unlocked=1,gameState='play';

let level=null,door=null,staticSolids=[],SOLIDS=[],levelWidth=W,levelHeight=H;

const graveStore={},particles=[];
const nightmare={tempInvert:0,tickTimer:6,baitFlash:0};
const ui={banner:'',bannerTimer:0,bannerDur:0,fakeDeathVal:0,fakeDeathTimer:0};
const hudFx={type:0,timer:0,freezeTimer:0,frozenTime:0,fakeDeaths:0};

const player={x:0,y:0,vx:0,vy:0,w:14,h:16,gdir:1,grounded:false,coyote:0,jumpsLeft:2};

function gravesFor(i){if(!graveStore[i])graveStore[i]=[];return graveStore[i];}

/* ============================================================ PARTICLES ============================================================ */
function spawnGibs(x,y,n){for(let i=0;i<n;i++){if(particles.length>=MAX_PARTICLES)break;const a=Math.random()*Math.PI*2,s=1.4+Math.random()*4.6;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.2,life:0.55+Math.random()*0.65,maxLife:1.2,size:Math.random()<0.35?4:2,color:Math.random()<0.28?'#8ff2ff':'#22cce8'});}}
function spawnBurst(x,y,n){for(let i=0;i<n;i++){if(particles.length>=MAX_PARTICLES)break;const a=-Math.PI/2+(Math.random()-0.5)*2.4,s=1.0+Math.random()*2.4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.28+Math.random()*0.22,maxLife:0.5,size:2,color:'#a9f4ff'});}}
function spawnDust(x,y,n,col){for(let i=0;i<n;i++){if(particles.length>=MAX_PARTICLES)break;const a=Math.random()*Math.PI*2,s=0.8+Math.random()*2.2;particles.push({x:x+(Math.random()-0.5)*10,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.0,life:0.3+Math.random()*0.3,maxLife:0.6,size:2,color:col||'#8a8a96'});}}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.vy+=0.42;p.x+=p.vx;p.y+=p.vy;p.life-=STEP;
    const box={x:p.x,y:p.y,w:p.size,h:p.size};
    for(let s=0;s<SOLIDS.length;s++){
      const so=SOLIDS[s];if(!overlap(box,so))continue;
      if(p.vy>0){p.y=so.y-p.size;p.vy*=-0.45;p.vx*=0.82;}
      else if(p.vy<0){p.y=so.y+so.h;p.vy*=-0.40;}
      break;
    }
    if(p.y>levelHeight-2){p.y=levelHeight-2;p.vy*=-0.40;p.vx*=0.85;}
    if(p.life<=0)particles.splice(i,1);
  }
}

/* ============================================================ HUD FX ============================================================ */
function showBanner(t,d){ui.banner=t;ui.bannerTimer=d;ui.bannerDur=d;}

function triggerHudGlitch(){
  const r=Math.random();
  if(r<0.4){hudFx.type=1;hudFx.timer=0.65;hudFx.fakeDeaths=deaths+Math.floor(Math.random()*200)+5;}
  else if(r<0.75){hudFx.type=2;hudFx.timer=0.85;hudFx.freezeTimer=0.85;hudFx.frozenTime=sessionTime;}
  else{hudFx.type=3;hudFx.timer=0.55;}
  Sfx.click();
}

/* ============================================================ BUILD ============================================================ */
function buildLevel(){
  const L=LEVELS[levelIndex];
  if(lastLevelIndex!==levelIndex){lastLevelIndex=levelIndex;doorBaited=false;}
  staticSolids=[];const hazards=[];
  for(let r=0;r<L.grid.length;r++){
    const row=L.grid[r];
    for(let c=0;c<row.length;c++){
      const ch=row[c];
      if(ch==='#')staticSolids.push({x:c*T,y:r*T,w:T,h:T});
      else if(ch==='^')hazards.push({x:c*T+3,y:r*T+7,w:T-6,h:13});
      else if(ch==='v')hazards.push({x:c*T+3,y:r*T,w:T-6,h:13});
    }
  }
  levelWidth=L.grid[0].length*T;
  levelHeight=L.grid.length*T;
  const traps=(L.traps||[]).map(src=>{
    const t=Object.assign({},src);
    if(t.type==='drop'){t.falling=false;t.triggered=false;t.timer=0;t.vy=0;t.gone=false;}
    else if(t.type==='jump'){t.state='idle';t.timer=0;t.h01=0;}
    else if(t.type==='invis'){t.revealed=false;}
    else if(t.type==='crush'){t.phase='idle';t.timer=0;t.y=t.upY;}
    else if(t.type==='button'){t.pressed=false;}
    else if(t.type==='fakedoor'){t.gone=false;t.timer=0;}
    else if(t.type==='ambush'){t.triggered=false;t.timer=0;t.h01=0;}
    else if(t.type==='crumble'){t.stepped=false;t.collapsed=false;t.timer=0;t.vy=0;t.gone=false;}
    else if(t.type==='rolling_spike'){t.active=false;t.speed=t.speed||2.4;t.maxSpeed=t.maxSpeed||3.2;t.triggerRadius=t.triggerRadius||240;if(t.minX===undefined)t.minX=t.x-120;if(t.maxX===undefined)t.maxX=t.x+120;t.vx=0;}
    else if(t.type==='eye_ambush'){t.dir=t.dir||1;t.speed=t.speed||6;t.triggerRadius=t.triggerRadius||220;t.phase='idle';t.timer=0;t.projActive=false;t.projX=0;t.projY=0;t.projVx=0;}
    else if(t.type==='collapse'){t.triggered=false;t.timer=0;t.falling=false;t.dropY=-t.dropH;t.landed=false;t.landedTimer=0;t.gone=false;}
    else if(t.type==='boulder'){t.active=false;t.gone=false;t.seg=0;t.progress=0;t.r=t.r||14;t.speed=t.speed||320;t.x=t.path[0].x;t.y=t.path[0].y;}
    return t;
  });
  level={def:L,t:0,hazards,traps,invertControls:!!L.invertControls,doorOpen:!L.buttonOrder,seq:[],seqFail:0};
  door={x:L.door.x,y:L.door.y,w:24,h:32,state:'idle',flee:L.doorFlees||null,sx:0,sy:0,tx:0,ty:0,ft:0};
  player.x=L.spawn.x;player.y=L.spawn.y;player.vx=0;player.vy=0;player.gdir=1;player.grounded=false;player.coyote=0;player.jumpsLeft=2;jumpBuffer=0;
  camera.x=clamp(player.x+player.w/2-W/2,0,Math.max(0,levelWidth-W));
  camera.y=clamp(player.y+player.h/2-H/2,0,Math.max(0,levelHeight-H));
  nightmare.tempInvert=0;nightmare.tickTimer=6+Math.random()*6;nightmare.baitFlash=0;
  ui.bannerTimer=0;ui.fakeDeathTimer=0;
  hudFx.type=0;hudFx.timer=0;hudFx.freezeTimer=0;
}

/* ============================================================ DEATH / WIN ============================================================ */
function kill(){
  if(gameState!=='play')return;
  deaths++;
  const cx=player.x+player.w/2,cy=player.y+player.h/2;
  spawnGibs(cx,cy,16);
  const gr=gravesFor(levelIndex);gr.push({x:cx,y:Math.min(player.y+player.h,levelHeight-6)});if(gr.length>120)gr.shift();
  Sfx.death();
  ui.bannerTimer=0;ui.fakeDeathTimer=0;
  buildLevel();
  flash=0.30;flashCol='#ff2a2a';shake=16;glitch=0.20;
}
function win(){
  if(gameState!=='play')return;
  ui.bannerTimer=0;ui.fakeDeathTimer=0;
  Sfx.win();spawnGibs(door.x+door.w/2,door.y+door.h/2,18);
  unlocked=Math.max(unlocked,levelIndex+2);
  levelIndex++;
  if(levelIndex>=LEVELS.length){gameState='victory';return;}
  buildLevel();flash=0.14;flashCol='#00ff66';shake=4;
}
function startLevel(i){levelIndex=i;gameState='play';particles.length=0;buildLevel();Sfx.ui();}
function restartRun(){deaths=0;sessionTime=0;levelIndex=0;lastLevelIndex=-1;doorBaited=false;for(const k in graveStore)delete graveStore[k];particles.length=0;gameState='play';buildLevel();Sfx.ui();}

/* ============================================================ BAIT DOOR ============================================================ */
function triggerBaitDoor(){
  player.x=level.def.spawn.x;player.y=level.def.spawn.y;player.vx=0;player.vy=0;player.gdir=1;player.grounded=false;player.jumpsLeft=2;
  camera.x=clamp(player.x+player.w/2-W/2,0,Math.max(0,levelWidth-W));
  camera.y=clamp(player.y+player.h/2-H/2,0,Math.max(0,levelHeight-H));
  Sfx.bait();Sfx.win();
  flash=0.55;flashCol='#00ff66';shake=26;glitch=0.55;nightmare.baitFlash=0.9;
  showBanner('LEVEL CLEARED',1.5);
  showFakeDeaths(deaths+42+Math.floor(Math.random()*88),1.0);
  level.traps.push({type:'ambush',x:180+level.def.spawn.x,baseY:320,w:20,h:32,triggerX:200+level.def.spawn.x,triggered:false,timer:0,h01:0});
  level.traps.push({type:'ambush',x:360+level.def.spawn.x,baseY:320,w:20,h:32,triggerX:380+level.def.spawn.x,triggered:false,timer:0,h01:0});
}

/* ============================================================ PHYSICS ============================================================ */
function buildSolids(){
  SOLIDS=staticSolids.slice();
  for(const t of level.traps){
    if(t.type==='drop'&&!t.gone)SOLIDS.push(t);
    else if(t.type==='invis')SOLIDS.push(t);
    else if(t.type==='crumble'&&!t.collapsed)SOLIDS.push(t);
  }
  return SOLIDS;
}
function moveX(dx){player.x+=dx;for(const s of SOLIDS){if(!overlap(player,s))continue;if(dx>0){player.x=s.x-player.w;player.vx=0;}else if(dx<0){player.x=s.x+s.w;player.vx=0;}}}
function moveY(dy){player.y+=dy;for(const s of SOLIDS){if(!overlap(player,s))continue;if(dy>0){player.y=s.y-player.h;if(player.gdir>0)player.grounded=true;}else if(dy<0){player.y=s.y+s.h;if(player.gdir<0)player.grounded=true;}player.vy=0;}}
function doJump(isAir){
  player.vy=-JUMP*player.gdir*(isAir?0.90:1.0);
  player.grounded=false;player.coyote=0;player.jumpsLeft=isAir?0:1;jumpBuffer=0;
  if(isAir){Sfx.dblJump();const fy=player.gdir>0?player.y+player.h:player.y;spawnBurst(player.x+player.w/2,fy,8);}
  else Sfx.jump();
}

/* ============================================================ TRAPS ============================================================ */
function pressButton(id){
  if(level.doorOpen)return;
  const seq=level.seq;if(seq.length&&seq[seq.length-1]===id)return;
  seq.push(id);const target=level.def.buttonOrder;
  for(let i=0;i<seq.length;i++){if(seq[i]!==target[i]){level.seq=[];level.seqFail=0.45;return;}}
  if(seq.length===target.length){level.doorOpen=true;Sfx.win();}
}

function updateTraps(dt){
  if(level.seqFail>0)level.seqFail-=dt;
  for(const t of level.traps){
    switch(t.type){
      case 'drop':{
        if(t.gone)break;
        if(!t.triggered&&overlap(player,t)){t.triggered=true;t.timer=0;}
        if(t.triggered&&!t.falling){t.timer+=dt;if(t.timer>=(t.delay!==undefined?t.delay:0.35)){t.falling=true;Sfx.click();}}
        if(t.falling){t.vy=Math.min(t.vy+GRAV*1.4,16);t.y+=t.vy;if(t.y>levelHeight+120)t.gone=true;}
        break;
      }
      case 'jump':{
        const pcx=player.x+player.w/2,pcy=player.y+player.h/2,cx=t.x+t.w/2,cy=t.baseY-12;
        const d=Math.hypot(pcx-cx,pcy-cy),R=t.radius||90;
        if(t.state==='idle'){t.h01=0;if(d<R){t.state='up';t.timer=0;Sfx.click();}}
        else if(t.state==='up'){t.timer+=dt;t.h01=Math.min(1,t.timer/0.12);if(t.timer>0.87){t.state='down';t.timer=0;}}
        else if(t.state==='down'){t.timer+=dt;t.h01=Math.max(0,1-t.timer/0.22);if(t.timer>0.22){t.state='cool';t.timer=0;}}
        else{t.timer+=dt;t.h01=0;if(t.timer>1.2&&d>R*1.35)t.state='idle';}
        break;
      }
      case 'invis':{
        if(!t.revealed){const pcx=player.x+player.w/2,pcy=player.y+player.h/2,cx=t.x+t.w/2,cy=t.y+t.h/2;if(Math.hypot(pcx-cx,pcy-cy)<115){t.revealed=true;spawnDust(cx,cy,5,'#c0c0c0');}}
        break;
      }
      case 'crush':{
        if(t.phase==='idle'){if(t.triggerX===undefined||player.x>t.triggerX){t.phase=t.once?'slam':'wait';t.timer=0;}}
        else if(t.phase==='wait'){t.timer+=dt;if(t.timer>1.8){t.phase='slam';t.timer=0;}}
        else if(t.phase==='slam'){if(t.timer===0){Sfx.thud();shake=Math.max(shake,9);spawnDust(t.x+t.w/2,t.downY+t.h,8,'#7a3a3a');}t.timer+=dt;const p=Math.min(1,t.timer/0.10);t.y=t.upY+(t.downY-t.upY)*(p*p);if(p>=1){t.phase='down';t.timer=0;}}
        else if(t.phase==='down'){t.timer+=dt;if(!t.once&&t.timer>0.9){t.phase='rise';t.timer=0;}}
        else if(t.phase==='rise'){t.timer+=dt;const p=Math.min(1,t.timer/0.7);t.y=t.downY+(t.upY-t.downY)*p;if(p>=1){t.phase='wait';t.timer=0;}}
        break;
      }
      case 'grav':{
        if(overlap(player,t)&&player.gdir!==t.dir){player.gdir=t.dir;player.vy=0;player.grounded=false;Sfx.whoosh();spawnBurst(player.x+player.w/2,player.y+player.h/2,6);}
        break;
      }
      case 'button':{
        const on=overlap(player,t);
        if(on&&!t.pressed){t.pressed=true;Sfx.ui();pressButton(t.id);}
        else if(!on)t.pressed=false;
        break;
      }
      case 'fakedoor':{
        if(!t.gone&&overlap(player,{x:t.x,y:t.y,w:24,h:32})){t.gone=true;t.timer=0;Sfx.click();spawnDust(t.x+12,t.y+16,8,'#00ff66');}
        if(t.gone)t.timer+=dt;
        break;
      }
      case 'ambush':{
        if(!t.triggered){const pcx=player.x+player.w/2;if(Math.abs(pcx-t.triggerX)<35){t.triggered=true;t.timer=0;Sfx.click();shake=Math.max(shake,5);}}
        if(t.triggered){t.timer+=dt;t.h01=Math.min(1,t.timer/0.06);}
        break;
      }
      case 'crumble':{
        if(t.gone)break;
        if(!t.stepped&&overlap(player,t)){t.stepped=true;t.timer=0;Sfx.click();}
        if(t.stepped&&!t.collapsed){t.timer+=dt;if(t.timer>0.5){t.collapsed=true;t.vy=0;spawnDust(t.x+t.w/2,t.y+t.h,8,'#c0c0c0');Sfx.thud();}}
        if(t.collapsed){t.vy=Math.min(t.vy+GRAV*1.4,16);t.y+=t.vy;if(t.y>levelHeight+120)t.gone=true;}
        break;
      }
      case 'rolling_spike':{
        const pcx=player.x+player.w/2,tcx=t.x+t.w/2;
        if(!t.active){if(Math.abs(pcx-tcx)<t.triggerRadius){t.active=true;t.vx=Math.sign(pcx-tcx)*t.speed;if(t.vx===0)t.vx=t.speed;Sfx.roll();shake=Math.max(shake,5);triggerHudGlitch();}}
        else{
          if(t.homing){t.vx+=Math.sign(pcx-tcx)*0.05;t.vx=clamp(t.vx,-t.maxSpeed,t.maxSpeed);if(Math.abs(t.vx)<0.4)t.vx=Math.sign(t.vx||1)*0.4;}
          t.x+=t.vx;
          if(t.x<t.minX){t.x=t.minX;t.vx=Math.abs(t.vx);}
          if(t.x+t.w>t.maxX){t.x=t.maxX-t.w;t.vx=-Math.abs(t.vx);}
        }
        break;
      }
      case 'eye_ambush':{
        const pcx=player.x+player.w/2,ecx=t.x+t.w/2,dist=Math.abs(pcx-ecx);
        if(t.phase==='idle'){if(dist<t.triggerRadius){t.phase='warning';t.timer=0;Sfx.eye();}}
        else if(t.phase==='warning'){t.timer+=dt;if(t.timer>0.55){t.phase='active';t.timer=0;t.projActive=true;t.projX=t.x+(t.dir>0?t.w:-14);t.projY=t.y+t.h/2-7;t.projVx=t.dir*t.speed;Sfx.whoosh();shake=Math.max(shake,6);}}
        else if(t.phase==='active'){t.timer+=dt;t.projX+=t.projVx;if(t.projX<camera.x-80||t.projX>camera.x+W+80||t.timer>2.2){t.projActive=false;t.phase='cooldown';t.timer=0;}}
        else if(t.phase==='cooldown'){t.timer+=dt;if(t.timer>1.8){t.phase='idle';t.timer=0;}}
        break;
      }
      case 'collapse':{
        if(!t.triggered){if(overlap(player,{x:t.x,y:t.y,w:t.w,h:t.h})){t.triggered=true;t.timer=0;Sfx.click();}}
        if(t.triggered&&!t.gone){
          t.timer+=dt;
          if(t.timer>0.3&&!t.falling){t.falling=true;Sfx.thud();shake=Math.max(shake,8);}
          if(t.falling){t.dropY+=14;if(t.dropY+t.dropH>=t.landY){t.dropY=t.landY-t.dropH;t.falling=false;t.landed=true;shake=Math.max(shake,14);spawnDust(t.dropX+t.dropW/2,t.landY,12,'#888');Sfx.thud();}}
          if(t.landed){t.landedTimer+=dt;if(t.landedTimer>0.6)t.gone=true;}
        }
        break;
      }
      case 'boulder':{
        if(!t.active){
          if(player.x+player.w/2>t.triggerX){
            t.active=true;t.seg=0;t.progress=0;
            t.x=t.path[0].x;t.y=t.path[0].y;
            Sfx.boulder();shake=Math.max(shake,14);triggerHudGlitch();
          }
          break;
        }
        if(t.gone)break;
        const a=t.path[t.seg],b=t.path[t.seg+1];
        if(!b){t.gone=true;break;}
        const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);
        t.progress+=(t.speed*dt)/Math.max(1,len);
        if(t.progress>=1){t.seg++;t.progress=0;t.x=b.x;t.y=b.y;if(t.seg>=t.path.length-1)t.gone=true;}
        else{t.x=a.x+dx*t.progress;t.y=a.y+dy*t.progress;}
        break;
      }
    }
  }
}

/* ============================================================ HAZARDS ============================================================ */
function checkHazards(){
  for(const h of level.hazards)if(overlap(player,h))return kill();
  for(const t of level.traps){
    if(t.type==='crush'){if(overlap(player,t))return kill();}
    else if(t.type==='jump'&&t.h01>0.15){const hh=t.h*t.h01;if(overlap(player,{x:t.x,y:t.baseY-hh,w:t.w,h:hh}))return kill();}
    else if(t.type==='ambush'&&t.h01>0.5){const hh=t.h*t.h01;if(overlap(player,{x:t.x,y:t.baseY-hh,w:t.w,h:hh}))return kill();}
    else if(t.type==='rolling_spike'&&t.active){if(overlap(player,{x:t.x+2,y:t.y+2,w:t.w-4,h:t.h-4}))return kill();}
    else if(t.type==='eye_ambush'&&t.projActive){if(overlap(player,{x:t.projX,y:t.projY,w:14,h:14}))return kill();}
    else if(t.type==='collapse'&&t.triggered&&!t.gone&&(t.falling||t.landed)){if(overlap(player,{x:t.dropX,y:t.dropY,w:t.dropW,h:t.dropH}))return kill();}
    else if(t.type==='boulder'&&t.active&&!t.gone){if(overlap(player,{x:t.x-t.r,y:t.y-t.r,w:t.r*2,h:t.r*2}))return kill();}
  }
}

function checkDoor(){
  if(!level.doorOpen)return;
  if(door.state==='fleeing')return;
  if(!overlap(player,door))return;
  if(door.state==='idle'&&door.flee){door.state='fleeing';door.ft=0;door.sx=door.x;door.sy=door.y;door.tx=door.flee.x;door.ty=door.flee.y;Sfx.whoosh();return;}
  if(level.def.baitDoor&&!doorBaited){doorBaited=true;triggerBaitDoor();return;}
  win();
}

/* ============================================================ NIGHTMARE UI ============================================================ */
function updateNightmare(dt){
  if(levelIndex<5)return;
  if(level.t<2.0)return;
  if(nightmare.baitFlash>0){nightmare.baitFlash-=dt;return;}
  if(nightmare.tempInvert>0){nightmare.tempInvert-=dt;if(nightmare.tempInvert<=0){nightmare.tempInvert=0;nightmare.tickTimer=6+Math.random()*6;}return;}
  nightmare.tickTimer-=dt;
  if(nightmare.tickTimer>0)return;
  nightmare.tickTimer=8+Math.random()*7;
  const roll=Math.random();
  if(roll<0.34){showBanner('LEVEL CLEARED',1.4);Sfx.win();}
  else if(roll<0.67){showFakeDeaths(deaths+55+Math.floor(Math.random()*145),0.85);Sfx.click();}
  else{nightmare.tempInvert=1.2+Math.random()*0.7;Sfx.whoosh();}
}

/* ============================================================ UPDATE ============================================================ */
function update(){
  const dt=STEP;level.t+=dt;sessionTime+=dt;
  if(flash>0)flash-=dt;
  if(glitch>0)glitch-=dt;
  if(shake>0)shake*=0.86;
  if(shake<0.6)shake=0;
  if(ui.bannerTimer>0)ui.bannerTimer-=dt;
  if(ui.fakeDeathTimer>0)ui.fakeDeathTimer-=dt;
  if(hudFx.timer>0)hudFx.timer-=dt;
  if(hudFx.freezeTimer>0)hudFx.freezeTimer-=dt;

  updateNightmare(dt);

  if(door.state==='fleeing'){
    door.ft+=dt;const p=Math.min(1,door.ft/1.05),e=1-Math.pow(1-p,3);
    door.x=door.sx+(door.tx-door.sx)*e;
    door.y=door.sy+(door.ty-door.sy)*e-Math.sin(p*Math.PI)*46;
    if(p>=1)door.state='home';
  }

  updateTraps(dt);
  buildSolids();

  let dir=0;
  if(keys['ArrowLeft']||keys['KeyA'])dir-=1;
  if(keys['ArrowRight']||keys['KeyD'])dir+=1;
  if(level.invertControls)dir=-dir;
  if(nightmare.tempInvert>0)dir=-dir;

  if(dir!==0)player.vx+=dir*ACCEL;else player.vx*=FRIC;
  player.vx=clamp(player.vx,-SPEED,SPEED);
  if(Math.abs(player.vx)<0.06)player.vx=0;

  player.vy+=GRAV*player.gdir;
  if(player.gdir>0)player.vy=Math.min(player.vy,MAXFALL);
  else player.vy=Math.max(player.vy,-MAXFALL);

  if(jumpBuffer>0)jumpBuffer--;
  if(player.coyote>0)player.coyote--;
  if(jumpBuffer>0){
    if(player.grounded||player.coyote>0)doJump(false);
    else if(player.jumpsLeft>0)doJump(true);
  }

  const held=keys['Space']||keys['ArrowUp']||keys['KeyW'];
  if(!held&&player.vy*player.gdir<-3)player.vy*=0.55;

  player.grounded=false;
  moveX(player.vx);moveY(player.vy);
  if(player.grounded){player.coyote=6;player.jumpsLeft=2;}
  player.x=clamp(player.x,0,levelWidth-player.w);

  const targetCamX=clamp(player.x+player.w/2-W/2,0,Math.max(0,levelWidth-W));
  const targetCamY=clamp(player.y+player.h/2-H/2,0,Math.max(0,levelHeight-H));
  camera.x+=(targetCamX-camera.x)*0.20;
  camera.y+=(targetCamY-camera.y)*0.20;
  if(Math.abs(targetCamX-camera.x)<0.3)camera.x=targetCamX;
  if(Math.abs(targetCamY-camera.y)<0.3)camera.y=targetCamY;

  if(player.y>levelHeight+70||player.y<-400){kill();return;}
  checkHazards();checkDoor();updateParticles();
}

function drawBlock(s,colorOverride){
  const c=TC();
  const col=colorOverride||c.block;
  ctx.fillStyle=col;ctx.fillRect(s.x,s.y,s.w,s.h);
  ctx.fillStyle=c.blockTop;
  if(s.w>4)ctx.fillRect(s.x+2,s.y+2,s.w-4,2);
  ctx.fillStyle=c.blockShadow;
  ctx.fillRect(s.x,s.y+s.h-3,s.w,3);

}
function drawSpike(x,y,w,h,dir){
  const c=TC();
  ctx.fillStyle=c.spike;
  const n=Math.max(1,Math.round(w/6)),step=w/n;
  for(let i=0;i<n;i++){
    const bx=x+i*step;
    ctx.beginPath();
    if(dir>0){ctx.moveTo(bx,y+h);ctx.lineTo(bx+step/2,y);ctx.lineTo(bx+step,y+h);}
    else{ctx.moveTo(bx,y);ctx.lineTo(bx+step/2,y+h);ctx.lineTo(bx+step,y);}
    ctx.closePath();ctx.fill();
  }
  ctx.fillStyle=c.spikeLight;
  ctx.fillRect(x,dir>0?y+h-2:y,w,2);
}
function drawGrave(x,y){
  const gx=Math.round(x-5),gy=Math.round(y-13);
  ctx.fillStyle='#4e4e5a';ctx.fillRect(gx,gy+2,10,11);ctx.fillRect(gx+1,gy,8,3);
  ctx.fillStyle='#6a6a78';ctx.fillRect(gx+1,gy,8,2);
  ctx.fillStyle='#1c1c22';ctx.fillRect(gx+4,gy+4,2,7);ctx.fillRect(gx+2,gy+6,6,2);
}
function drawPlayer(){

  ctx.fillStyle=c.player;ctx.fillRect(p.x,p.y,p.w,p.h);

}
function drawDoorBody(d,wings){

    ctx.beginPath();ctx.moveTo(d.x,d.y+8);ctx.lineTo(d.x-14,d.y+2+flap);ctx.lineTo(d.x-10,d.y+18);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(d.x+d.w,d.y+8);ctx.lineTo(d.x+d.w+14,d.y+2-flap);ctx.lineTo(d.x+d.w+10,d.y+18);ctx.closePath();ctx.fill();
  }

}
function drawRollingSpike(t){
  const c=TC();
  if(!t.active){
    ctx.fillStyle='#5a2020';ctx.beginPath();ctx.arc(t.x+t.w/2,t.y+t.h/2,t.w/2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3a1010';ctx.fillRect(t.x+4,t.y+5,2,2);ctx.fillRect(t.x+t.w-6,t.y+5,2,2);

    ctx.fillStyle='#ff5544';

      const sx=t.x+t.w/2+Math.cos(a+rot)*(t.w/2+4),sy=t.y+t.h/2+Math.sin(a+rot)*(t.h/2+4);

function drawEyeAmbush(t){

function drawBoulder(t){
  const c=TC();

  const r=t.r;

    const sx=t.x+Math.cos(a+rot)*(r+3),sy=t.y+Math.sin(a+rot)*(r+3);
    ctx.fillRect(sx-2,sy-2,4,4);
  }

  ctx.fillStyle=c.spike;ctx.fillRect(t.x-4,t.y-4,1,1);ctx.fillRect(t.x+3,t.y-4,1,1);
}
function drawBanner(){
  if(ui.bannerTimer<=0)return;
  const c=TC();
  const elapsed=ui.bannerDur-ui.bannerTimer;
  const a=Math.min(1,elapsed/0.15)*Math.min(1,ui.bannerTimer/0.3);
  ctx.globalAlpha=0.78*a;ctx.fillStyle=c.panelSolid;ctx.fillRect(0,H/2-52,W,104);
  ctx.globalAlpha=a;ctx.textAlign='center';
  ctx.font='bold 30px "Courier New",monospace';ctx.fillStyle=c.green;ctx.fillText(ui.banner,W/2,H/2-18);
  ctx.font='bold 10px "Courier New",monospace';ctx.fillStyle=c.textDim;ctx.fillText('✦ ✦ ✦',W/2,H/2+16);
  ctx.globalAlpha=1;ctx.textAlign='left';
}

/* ============================================================ RENDER ============================================================ */
function render(){
  const c=TC();
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  /* bg */
  ctx.fillStyle=c.bg;ctx.fillRect(-30,-30,W+60,H+60);
  ctx.fillStyle=c.bgLine;
  for(let y=-40;y<H+40;y+=40)for(let x=-40;x<W+40;x+=40)ctx.fillRect(x,y,1,1);

  /* world */
  ctx.save();
  ctx.translate(-Math.round(camera.x),-Math.round(camera.y));

  for(const s of staticSolids)drawBlock(s);

  const graves=gravesFor(levelIndex);
  for(let i=0;i<graves.length;i++)drawGrave(graves[i].x,graves[i].y);

  for(const t of level.traps){
    if(t.type==='drop'){if(t.gone)continue;drawBlock(t,t.falling?'#9a9a9a':undefined);}
    else if(t.type==='invis'){ctx.globalAlpha=t.revealed?1:0.07;drawBlock(t);ctx.globalAlpha=1;}
    else if(t.type==='fake'){drawBlock(t);ctx.fillStyle='rgba(255,255,255,0.10)';ctx.fillRect(t.x,t.y+2,t.w,1);}
    else if(t.type==='jump'){
      if(t.h01<=0.02){ctx.fillStyle='#5a2020';ctx.fillRect(t.x+4,t.baseY-3,t.w-8,3);}
      else{const hh=t.h*t.h01;drawSpike(t.x,t.baseY-hh,t.w,hh,1);}
    }
    else if(t.type==='ambush'){if(!t.triggered)continue;const hh=t.h*t.h01;if(hh<0.5)continue;drawSpike(t.x,t.baseY-hh,t.w,hh,1);}
    else if(t.type==='crumble'){
      if(t.gone)continue;
      if(t.collapsed)drawBlock(t,'#8a8a8a');
      else if(t.stepped){const fl=Math.sin(t.timer*55)>0;ctx.globalAlpha=fl?1:0.35;drawBlock(t,fl?undefined:'#8a8a8a');ctx.globalAlpha=1;}
      else drawBlock(t);
    }
    else if(t.type==='crush'){
      if(t.y>-120){
        ctx.fillStyle='#8a1f1f';ctx.fillRect(t.x,t.y,t.w,t.h);
        ctx.fillStyle=c.spike;
        for(let i=0;i<t.h;i+=20)ctx.fillRect(t.x+4,t.y+i+4,t.w-8,4);
        ctx.strokeStyle=c.blockLine;ctx.lineWidth=2;ctx.strokeRect(t.x+1,t.y+1,t.w-2,t.h-2);
      }
    }
    else if(t.type==='button'){
      const lit=t.pressed;
      ctx.fillStyle=lit?c.green:'#3a5a44';ctx.fillRect(t.x,t.y,t.w,t.h);
      ctx.strokeStyle=c.blockLine;ctx.lineWidth=2;ctx.strokeRect(t.x,t.y,t.w,t.h);
      ctx.fillStyle=lit?'#08160c':'#8a9a90';
      for(let i=0;i<t.id;i++)ctx.fillRect(t.x+4+i*6,t.y+2,3,2);
      ctx.font='bold 10px "Courier New",monospace';ctx.textAlign='center';
      ctx.fillStyle=lit?c.green:'#8a9a90';ctx.fillText(String(t.id),t.x+t.w/2,t.y-12);ctx.textAlign='left';
    }
    else if(t.type==='fakedoor'){
      if(t.gone){if(t.timer<0.5){const a=1-t.timer/0.5;ctx.globalAlpha=a;ctx.fillStyle=c.green;ctx.fillRect(t.x-10*(1-a),t.y-10*(1-a),24+20*(1-a),32+20*(1-a));ctx.globalAlpha=1;}continue;}
      ctx.globalAlpha=0.9;drawDoorBody({x:t.x,y:t.y,w:24,h:32},false);ctx.globalAlpha=1;
    }
    else if(t.type==='grav'){ctx.fillStyle=c.grav;ctx.fillRect(t.x,t.y,t.w,t.h);}
    else if(t.type==='rolling_spike')drawRollingSpike(t);
    else if(t.type==='eye_ambush')drawEyeAmbush(t);
    else if(t.type==='boulder')drawBoulder(t);
    else if(t.type==='collapse'){
      if(!t.triggered){ctx.fillStyle='rgba(255,204,0,0.10)';ctx.fillRect(t.x,t.y,t.w,t.h);ctx.fillStyle='rgba(255,204,0,0.30)';ctx.fillRect(t.x+2,t.y+2,t.w-4,1);}
      if(t.falling||t.landed){ctx.fillStyle='#666';ctx.fillRect(t.dropX,t.dropY,t.dropW,t.dropH);ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.strokeRect(t.dropX,t.dropY,t.dropW,t.dropH);}
    }
  }

  for(const h of level.hazards)drawSpike(h.x,h.y,h.w,h.h,1);
  if(level.doorOpen)drawDoorBody(door,door.state==='fleeing');
  drawPlayer();

  for(const p of particles){
    const a=clamp(p.life/p.maxLife,0,1);
    ctx.globalAlpha=a;ctx.fillStyle=p.color;
    ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size);
  }
  ctx.globalAlpha=1;
  ctx.restore(); /* world */

  /* vignette */
  if(levelIndex>=5){
    const inten=0.10+0.04*Math.min(6,levelIndex-5);
    ctx.fillStyle=c.vignette+inten+')';
    ctx.fillRect(0,0,W,14);ctx.fillRect(0,H-14,W,14);
    ctx.fillRect(0,0,10,H);ctx.fillRect(W-10,0,10,H);
  }

  /* HUD */
  ctx.textBaseline='top';ctx.font='bold 11px "Courier New",monospace';ctx.textAlign='left';
  ctx.fillStyle=c.text;
  ctx.fillText('STAGE '+String(levelIndex+1).padStart(2,'0'),12,10);

  let shownDeaths=deaths;
  if(ui.fakeDeathTimer>0)shownDeaths=ui.fakeDeathVal;
  else if(hudFx.type===1&&hudFx.timer>0)shownDeaths=hudFx.fakeDeaths;
  ctx.fillStyle=(ui.fakeDeathTimer>0||(hudFx.type===1&&hudFx.timer>0))?'#ff6a6a':c.danger;
  ctx.fillText('DEATHS: '+shownDeaths,12,25);

  const shownTime=hudFx.freezeTimer>0?hudFx.frozenTime:sessionTime;
  ctx.textAlign='right';
  ctx.fillStyle=hudFx.freezeTimer>0?'#aaffcc':c.green;
  ctx.fillText(fmtTime(shownTime),W-12,10);
  ctx.fillStyle=c.textDim;
  ctx.fillText('ESC: STAGES   M: '+(Sfx.isMuted()?'SILENT':'SOUND'),W-12,25);
  ctx.fillText('T: THEME ('+(currentTheme==='dark'?'DARK':'LIGHT')+')   R: RETRY',W-12,40);
  ctx.textAlign='left';

  /* horizontal progress */
  const progX=clamp(player.x/Math.max(1,levelWidth-W),0,1);
  ctx.fillStyle=c.textDim;ctx.fillRect(W-132,52,120,3);
  ctx.fillStyle=c.green;ctx.fillRect(W-132,52,120*progX,3);

  /* vertical progress (only for tall levels) */
  if(levelHeight>H+10){
    const progY=clamp(player.y/Math.max(1,levelHeight-H),0,1);
    ctx.fillStyle=c.textDim;ctx.fillRect(W-24,62,3,80);
    ctx.fillStyle=c.accent;ctx.fillRect(W-24,62,3,80*progY);
  }

  if(nightmare.tempInvert>0){
    const a=0.30+0.25*Math.sin(performance.now()*0.024);
    ctx.fillStyle=`rgba(255,30,80,${a})`;
    ctx.fillRect(0,0,5,H);ctx.fillRect(W-5,0,5,H);
    ctx.textAlign='center';ctx.font='bold 9px "Courier New",monospace';
    ctx.fillStyle=`rgba(255,120,120,${a+0.15})`;
    ctx.fillText('! CONTROLS INVERTED !',W/2,26);ctx.textAlign='left';
  }

  if(level.t<2.4){
    const a=level.t<1.8?1:(2.4-level.t)/0.6;
    ctx.globalAlpha=Math.max(0,a);ctx.textAlign='center';
    ctx.font='bold 16px "Courier New",monospace';ctx.fillStyle=c.text;
    ctx.fillText(LEVELS[levelIndex].name,W/2,58);
    ctx.font='bold 10px "Courier New",monospace';ctx.fillStyle=c.textDim;
    ctx.fillText('STAGE '+String(levelIndex+1).padStart(2,'0'),W/2,82);
    if(LEVELS[levelIndex].hint){
      ctx.fillStyle=levelIndex>=5?'#8a2a2a':c.accent;
      ctx.fillText(LEVELS[levelIndex].hint,W/2,100);
    }
    ctx.globalAlpha=1;ctx.textAlign='left';
  }

  if(level.seqFail>0){ctx.fillStyle=`rgba(255,42,42,${level.seqFail*0.5})`;ctx.fillRect(0,0,W,H);}
  if(flash>0){const a=Math.min(0.55,flash);ctx.fillStyle=flashCol==='#00ff66'?`rgba(0,255,102,${a*0.8})`:`rgba(255,42,42,${a})`;ctx.fillRect(0,0,W,H);}
  if(glitch>0){const a=Math.min(0.55,glitch);ctx.fillStyle=c.glitchR+(a*0.55)+')';ctx.fillRect(0,0,W,H);ctx.fillStyle=c.glitchC+(a*0.30)+')';ctx.fillRect((Math.random()-0.5)*8,0,W,H);}

  if(hudFx.type===3&&hudFx.timer>0){
    for(let i=0;i<7;i++){
      const y=Math.random()*H,h=2+Math.random()*4;
      ctx.fillStyle=Math.random()<0.5?c.glitchR+'0.42)':c.glitchC+'0.22)';
      ctx.fillRect(0,y,W,h);
    }
  }

  drawBanner();
  if(gameState==='select')drawLevelSelect();
  else if(gameState==='victory')drawVictory();
  ctx.restore();
}

/* ============================================================ OVERLAYS ============================================================ */
function drawLevelSelect(){
  const c=TC();
  ctx.fillStyle=c.panel;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='bold 16px "Courier New",monospace';ctx.fillStyle=c.text;
  ctx.fillText('SELECT STAGE',W/2,16);
  ctx.font='bold 8px "Courier New",monospace';ctx.fillStyle=c.textDim;
  ctx.fillText('CLICK OR PRESS 1-9 / 0   •   ESC TO RESUME',W/2,38);

  for(let i=0;i<LEVELS.length;i++){
    const r=lsRect(i);
    const open=i<unlocked;
    const hover=open&&mouse.x>=r.x&&mouse.x<=r.x+r.w&&mouse.y>=r.y&&mouse.y<=r.y+r.h;
    ctx.fillStyle=open?(hover?c.lsHover:c.lsOpen):c.lsLocked;
    ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.lineWidth=2;
    ctx.strokeStyle=open?(hover?c.green:c.lsBorderOpen):c.lsBorderLocked;
    ctx.strokeRect(r.x+1,r.y+1,r.w-2,r.h-2);
    ctx.font='bold 16px "Courier New",monospace';
    ctx.fillStyle=open?(hover?c.green:c.lsNumOpen):c.lsNumLocked;
    ctx.fillText(String(i+1).padStart(2,'0'),r.x+r.w/2,r.y+14);
    ctx.font='bold 6px "Courier New",monospace';
    ctx.fillStyle=open?c.textDim:c.lsNumLocked;
    ctx.fillText(open?LEVELS[i].name:'LOCKED',r.x+r.w/2,r.y+38);
  }
  ctx.font='bold 8px "Courier New",monospace';ctx.fillStyle=c.textDim;
  ctx.fillText('HOLD SHIFT + ESC TO UNLOCK ALL (TESTING)',W/2,H-12);
  ctx.textAlign='left';
}
function drawVictory(){
  const c=TC();
  ctx.fillStyle=c.panel;ctx.fillRect(0,0,W,H);
  const rageScore=Math.round(deaths*sessionTime);
  ctx.textAlign='center';
  ctx.font='bold 24px "Courier New",monospace';ctx.fillStyle=c.green;
  ctx.fillText('YOU BEAT THE NIGHTMARE',W/2,100);
  ctx.font='bold 11px "Courier New",monospace';ctx.fillStyle=c.text;
  ctx.fillText('TOTAL DEATHS: '+deaths,W/2,156);
  ctx.fillText('TOTAL TIME:   '+fmtTime(sessionTime),W/2,176);
  ctx.font='bold 18px "Courier New",monospace';ctx.fillStyle=c.danger;
  ctx.fillText('RAGE SCORE',W/2,214);
  ctx.font='bold 22px "Courier New",monospace';ctx.fillStyle='#ff6a4a';
  ctx.fillText(String(rageScore),W/2,236);
  ctx.font='bold 10px "Courier New",monospace';ctx.fillStyle=c.textDim;
  ctx.fillText('PRESS R TO RUN IT AGAIN   •   ESC FOR STAGE SELECT',W/2,290);
  ctx.textAlign='left';
}
function fmtTime(t){const m=Math.floor(t/60),s=Math.floor(t%60),ms=Math.floor((t%1)*1000);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(ms).padStart(3,'0');}

/* ============================================================ LOOP ============================================================ */
let acc=0,last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000;last=now;
  if(dt>0.25)dt=0.25;
  acc+=dt;
  let guard=0;
  while(acc>=STEP&&guard++<8){
    if(gameState==='play')update();
    acc-=STEP;
  }
  render();
}
buildLevel();
requestAnimationFrame(loop);
</script>
